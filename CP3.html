<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apresentação</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #d3c7b6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .boas-vindas {
      background-color: #8b5a2b;
      color: #fff;
      padding: 50px 40px;
      border-radius: 14px;
      text-align: center;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      margin-bottom: 40px;
    }

    .boas-vindas h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    .boas-vindas p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .menu a {
      background-color: #2b1d1a;
      color: #f3e9dc;
      font-weight: bold;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      border: 2px solid #8b5a2b;
      transition: background-color 0.2s, color 0.2s;
    }

    .menu a:hover {
      background-color: #8b5a2b;
      color: #fff;
    }
  </style>
</head>
<body>

  <section class="boas-vindas">
    <h1>Bem-vindo(a)!</h1>
    <p>
      Este é o meu site. Aqui você encontra meu currículo, um formulário,
      conteúdos multimídia e gráficos. Escolha uma opção abaixo para navegar.
    </p>
  </section>

  <nav class="menu">
    <a href="1.curriculo.html">Currículo</a>
    <a href="2.formulario.html">Formulário</a>
    <a href="3.multimidia.html">Multimídia</a>
    <a href="4.grafico.html">Gráfico</a>
  </nav>

</body>
</html>
