<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Cadastro</title>

    <style>
        /* Configurações gerais da página */
        body {
            font-family: Times, New Roman;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

         .formulario {
             max-width: 700px;
            margin: 0 auto;
             background: #ffffff;
            padding: 60px 80px;
             border: 1px solid #ddd8cc;
        }

        .formulario h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
         

        section h2 {
            font-size: 16px;
            text-transform: none;
            border-bottom: 2px solid #c9c3b3;
            padding-bottom: 8px;
            margin-bottom: 10px;
            color: #7a4b2e;
        }

        .campo {
            margin-bottom: 15px;
        }

        
        .campo label {
            display: block;         
            margin-bottom: 5px;
            font-weight: bold;
            color: #333333;
        }

      
        .campo input,
        .campo select {
            width: 100%;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;  
            font-size: 16px;
        }

    </style>
</head>

<body>

        <form action="#" method="post">
    <div class="formulario">
    <h1>Cadastro</h1>

    <div class="campo">
    <label>Nome</label>
    <input type="text" placeholder="Digite seu nome">
    </div>

    <div class="campo">
    <label>E-mail</label>
    <input type="email" placeholder="seuemail@exemplo.com">
    </div>

    <div class="campo">
    <label>Telefone</label>
    <input type="text" placeholder="Seu numero de telefone">
    </div>

    <div class="campo">
    <label>Senha</label>
    <input type="password" placeholder="Crie uma senha">
    </div>

    <button type="submit">Cadastrar</button>


        </form>
    </div>
    
    <header>
    <a href="apresentação.html">← Voltar ao início</a>

  </header>

</body>
</html>
